title: Playtest fixes — /sq-playtest findings (2026-07-10, mutant_wasteland + elemental_harmony)
description: 'Fixes for the 2026-07-10 solo /sq-playtest sweep across flickering_reach (Harpo/Chico) and shattered_accord (Groucho). Findings + repro/evidence in ~/Projects/sq-playtest-pingpong.md. 7 findings: confrontation double-resolve, mutation-economy projection, region-move loss on empty-prose recovery, flickering_reach split-brain bootstrap, cross-genre wrong-Other seating, combat-prose typos, shattered_accord history.yaml schema violation. Diagnostics: #4 is flickering_reach-specific (shattered_accord bootstraps region coherently); #5 wrong-Other reproduces in 3 contexts; parked coyote_star Attack(STR) crash confirmed SWN-specific.'
priority: p1
status: backlog
repos: server,ui,content
