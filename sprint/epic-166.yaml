  - id: 166-10
    title: "Green Room §6 coal→diamond: promote the seated Other's placeholder name when prose names them — panel shows 'the loudest one' while narration says the proper name (player-visible split)"
    points: 3
    priority: p2
    status: in_review
    started: '2026-07-13'
    repos: server, ui
    workflow: tdd
    acceptance_criteria:
      - Narrator prose naming the lone seated coal Other records the prose name as an alias on that identity — no new NPC in snapshot.npcs, identity_key unchanged (core.name stays coal)
      - The confrontation panel carries the prose name to the player on a DISPLAY-only field (actors[].display_name); ConfrontationOverlay renders display_name ?? name
      - EncounterActor.name stays canonical (== Npc.core.name). The seat id the engine targets is NEVER repointed — a seat left under the prose alias is an unreachable opponent (encounter_lifecycle.py:438-446)
      - "The named Other remains mechanically reachable: find_creature_core resolves it BOTH by seat id and by the prose name (via the alias ledger), so apply_damage / wn_tools / apply_status / query_encounter and the player's own dice throw all still land"
      - The panel's opponent_hp survives the promotion — _primary_hp silently omits the key on a resolver miss, and the HP bar must not vanish
      - 'No in-encounter reference is rewritten (initiative token_id, sealed commits, tags): nothing is renamed, so nothing dangles'
      - 'OTEL: green_room.alias_attached (the identity learned the name) AND green_room.actor_promoted carrying seat_id + display_name (the name reached the surface the player is looking at)'
      - 'No hijack: an authored Other, an ambiguous two-opponent scene, and a non-hostile bystander mention are never promoted'
    branch: feat/166-10-green-room-coal-to-diamond-name-promotion
    review_findings: "REJECT #2 (completeness, not correctness — the round-1 CRITICAL is genuinely fixed and verified). [HIGH] The Fate confrontation surface is half-wired: the promotion is NOT ruleset-gated so it fires for Fate encounters, but fate_projection._project_conflict_participant (fate_projection.py:156) drops display_name and FateConflictSurface.tsx:861 renders the seat id — INCLUDING the attack-target dropdown. This story's own bug is live on 4 of 11 packs (pulp_noir, spaghetti_western, tea_and_murder, wry_whimsy), and would ship with green_room.actor_promoted asserting in the GM panel that the promotion worked. CLAUDE.md: 'if it needs 5 connections, make 5.' [MEDIUM] find_creature_core's widening to resolve_roster_npc picks the WRONG creature on a case/diacritic fold-collision — apply_damage can damage the wrong NPC, silently, across ~40 call sites (reproduced; reachable for AUTHORED NPCs, which are not name-deduped). Fix: exact match first, then fall back. [MEDIUM] ActorChip's avatar initial (ConfrontationOverlay.tsx:384) still renders actor.name.charAt(0) — a fifth display site; the coal name leaks one character at a time. [MEDIUM] No test drives apply_damage against a promoted Other and asserts HP drops — the round-1 failure mode is still not covered end-to-end. Plus 4 LOW (docstring says find_creature_core is 'an exact match', falsified by the same commit; stale encounter_lifecycle premises; promote_actor negatives unpinned; round-1-era local saves fail extra=forbid)."
